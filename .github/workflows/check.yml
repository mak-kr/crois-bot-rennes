name: Check CROUS Rennes

on:
  schedule:
    # Toutes les 10 minutes (attention: GitHub garantit "au moins"
    # ce délai, en pratique ça peut varier de quelques minutes selon
    # la charge des serveurs GitHub)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'interface GitHub

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crous_bot.py

      - name: Commit updated seen_logements.json
        run: |
          git config --global user.name "crous-bot"
          git config --global user.email "crous-bot@users.noreply.github.com"
          git add seen_logements.json
          git diff --staged --quiet || git commit -m "Update seen logements"
          git push
